<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scraper Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  header { background: #1a1d2e; border-bottom: 1px solid #2d3148; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
  .last-update { margin-left: auto; font-size: 12px; color: #64748b; }

  .summary { display: flex; gap: 12px; padding: 20px 24px; flex-wrap: wrap; }
  .stat-card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 8px; padding: 16px 20px; min-width: 140px; }
  .stat-card .label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .stat-card .value { font-size: 28px; font-weight: 700; color: #fff; }
  .stat-card .sub { font-size: 11px; color: #64748b; margin-top: 2px; }

  .filters { padding: 0 24px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #2d3148; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; transition: all .15s; }
  .filter-btn:hover { border-color: #4f6ef7; color: #4f6ef7; }
  .filter-btn.active { background: #4f6ef7; border-color: #4f6ef7; color: #fff; }

  .reports { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 10px; }

  .branch-card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 10px; overflow: hidden; }
  .branch-card.failed { border-left: 3px solid #ef4444; }
  .branch-card.partial { border-left: 3px solid #f59e0b; }
  .branch-card.success { border-left: 3px solid #22c55e; }

  .branch-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; }
  .branch-header:hover { background: #1e2236; }
  .chain-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .chain-newworld { background: #064e3b; color: #34d399; }
  .chain-paknsave { background: #451a03; color: #fb923c; }
  .chain-woolworths { background: #1e1b4b; color: #818cf8; }
  .branch-name { font-weight: 600; font-size: 14px; color: #e2e8f0; }
  .status-badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; }
  .status-success { background: #14532d; color: #22c55e; }
  .status-partial { background: #451a03; color: #f59e0b; }
  .status-failed  { background: #450a0a; color: #ef4444; }
  .chevron { color: #475569; font-size: 12px; margin-left: 8px; transition: transform .2s; }
  .branch-card.open .chevron { transform: rotate(90deg); }

  .branch-body { display: none; padding: 0 18px 16px; border-top: 1px solid #2d3148; }
  .branch-card.open .branch-body { display: block; }

  .metrics { display: flex; gap: 20px; padding: 12px 0 14px; flex-wrap: wrap; }
  .metric { text-align: center; }
  .metric .m-val { font-size: 20px; font-weight: 700; color: #fff; }
  .metric .m-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }

  .cats-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat { font-size: 12px; padding: 3px 10px; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
  .cat-success { background: #14532d22; border: 1px solid #16653133; color: #4ade80; }
  .cat-empty   { background: #1e293b; border: 1px solid #2d3148; color: #64748b; }
  .cat-failed  { background: #450a0a22; border: 1px solid #7f1d1d44; color: #f87171; }
  .cat .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cat-success .dot { background: #22c55e; }
  .cat-empty   .dot { background: #475569; }
  .cat-failed  .dot { background: #ef4444; }
  .cat-reason { font-size: 10px; color: #94a3b8; margin-left: 2px; }

  .timestamp { font-size: 11px; color: #475569; margin-top: 12px; }

  .empty-state { text-align: center; padding: 60px 20px; color: #475569; }
  .empty-state p { margin-top: 8px; font-size: 13px; }

  .error-banner { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; padding: 10px 16px; border-radius: 8px; font-size: 13px; margin: 0 24px 16px; }
</style>
</head>
<body>

<header>
  <div class="live-dot" id="liveDot"></div>
  <h1>Scraper Monitor</h1>
  <span class="last-update" id="lastUpdate">Connecting...</span>
</header>

<div class="summary">
  <div class="stat-card"><div class="label">Total Branches</div><div class="value" id="sTotal">—</div></div>
  <div class="stat-card"><div class="label">Products</div><div class="value" id="sProducts">—</div></div>
  <div class="stat-card"><div class="label">Price Changes</div><div class="value" id="sPrices">—</div></div>
  <div class="stat-card"><div class="label">Specials</div><div class="value" id="sSpecials">—</div></div>
  <div class="stat-card"><div class="label">Out of Stock</div><div class="value" id="sOos">—</div></div>
  <div class="stat-card"><div class="label">Cat Failures</div><div class="value" id="sFailed" style="color:#ef4444">—</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" data-chain="all">All</button>
  <button class="filter-btn" data-chain="New World">New World</button>
  <button class="filter-btn" data-chain="PAK'nSAVE">PAK'nSAVE</button>
  <button class="filter-btn" data-chain="Woolworths">Woolworths</button>
</div>

<div id="errorBanner" style="display:none" class="error-banner"></div>
<div class="reports" id="reports"></div>

<script>
const API = 'http://localhost:8765';
let allReports = [];
let activeChain = 'all';
let openCards = new Set();

function chainClass(chain) {
  if (chain.toLowerCase().includes('new world')) return 'chain-newworld';
  if (chain.toLowerCase().includes('pak')) return 'chain-paknsave';
  return 'chain-woolworths';
}

function catClass(status) {
  return status === 'success' ? 'cat-success' : status === 'failed' ? 'cat-failed' : 'cat-empty';
}

function fmt(n) {
  return n >= 1000 ? (n/1000).toFixed(1) + 'k' : n;
}

function timeAgo(iso) {
  const d = new Date(iso);
  const s = Math.round((Date.now() - d) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ago`;
}

function renderSummary(reports) {
  const total = reports.length;
  const products = reports.reduce((a, r) => a + r.total_products, 0);
  const prices = reports.reduce((a, r) => a + r.price_changes, 0);
  const specials = reports.reduce((a, r) => a + r.specials, 0);
  const oos = reports.reduce((a, r) => a + r.out_of_stock, 0);
  const failed = reports.reduce((a, r) => a + r.categories.filter(c => c.status === 'failed').length, 0);
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sProducts').textContent = fmt(products);
  document.getElementById('sPrices').textContent = fmt(prices);
  document.getElementById('sSpecials').textContent = fmt(specials);
  document.getElementById('sOos').textContent = fmt(oos);
  document.getElementById('sFailed').textContent = failed;
}

function renderReports(reports) {
  const filtered = activeChain === 'all' ? reports : reports.filter(r => r.chain === activeChain);
  const container = document.getElementById('reports');

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div style="font-size:40px">📡</div><p>No reports yet — start a scraper and results will appear here.</p></div>`;
    return;
  }

  // Newest first
  const sorted = [...filtered].reverse();
  container.innerHTML = sorted.map((r, i) => {
    const id = `card-${i}`;
    const isOpen = openCards.has(id);
    const failedCats = r.categories.filter(c => c.status === 'failed');
    return `
    <div class="branch-card ${r.status} ${isOpen ? 'open' : ''}" id="${id}">
      <div class="branch-header" onclick="toggle('${id}')">
        <span class="chain-tag ${chainClass(r.chain)}">${r.chain}</span>
        <span class="branch-name">${r.branch_name}</span>
        ${failedCats.length ? `<span style="font-size:11px;color:#ef4444;margin-left:4px">${failedCats.length} cat fail${failedCats.length>1?'s':''}</span>` : ''}
        <span class="status-badge status-${r.status}">${r.status}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="branch-body">
        <div class="metrics">
          <div class="metric"><div class="m-val">${fmt(r.total_products)}</div><div class="m-lbl">Products</div></div>
          <div class="metric"><div class="m-val">${fmt(r.price_changes)}</div><div class="m-lbl">Price Changes</div></div>
          <div class="metric"><div class="m-val" style="color:#fbbf24">${fmt(r.specials)}</div><div class="m-lbl">Specials</div></div>
          <div class="metric"><div class="m-val" style="color:#f87171">${fmt(r.out_of_stock)}</div><div class="m-lbl">Out of Stock</div></div>
          <div class="metric"><div class="m-val">${r.categories.length}</div><div class="m-lbl">Categories</div></div>
        </div>
        <div class="cats-title">Categories</div>
        <div class="cats">
          ${r.categories.map(c => `
            <div class="cat ${catClass(c.status)}" title="${c.reason || c.status}">
              <span class="dot"></span>
              ${c.name}${c.products ? ` <span style="opacity:.6">(${c.products})</span>` : ''}
              ${c.reason ? `<span class="cat-reason">· ${c.reason.substring(0,40)}</span>` : ''}
            </div>
          `).join('')}
        </div>
        <div class="timestamp">${new Date(r.timestamp).toLocaleString()} · branch_id: ${r.branch_id || '—'}</div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  if (openCards.has(id)) openCards.delete(id);
  else openCards.add(id);
  const card = document.getElementById(id);
  if (card) card.classList.toggle('open', openCards.has(id));
}

async function fetchReports() {
  try {
    const res = await fetch(`${API}/reports`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allReports = await res.json();
    document.getElementById('errorBanner').style.display = 'none';
    document.getElementById('liveDot').style.background = '#22c55e';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #22c55e';
    document.getElementById('lastUpdate').textContent = `Updated ${new Date().toLocaleTimeString()}`;
    renderSummary(allReports);
    renderReports(allReports);
  } catch (e) {
    document.getElementById('liveDot').style.background = '#ef4444';
    document.getElementById('liveDot').style.boxShadow = '0 0 8px #ef4444';
    document.getElementById('lastUpdate').textContent = 'API unreachable';
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('errorBanner').textContent = `Cannot reach API at ${API} — make sure uvicorn is running.`;
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeChain = btn.dataset.chain;
    renderReports(allReports);
  });
});

fetchReports();
setInterval(fetchReports, 5000);
</script>
</body>
</html>
